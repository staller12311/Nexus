# 复制本文件为 config.yaml 后按需修改。
# 加载优先级：命令行 --config > 环境变量 AGENT_CONFIG > ./config.yaml
# 所有相对路径（workspace / extra_workspaces / db_path / logging.file / system_prompt_file）
# 都相对于「配置文件所在目录」解析。
# 密钥不写在这里：只写环境变量名 api_key_env，真实值放在 .env 或系统环境变量里。

default_model: deepseek

models:
  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    api_key_env: DEEPSEEK_API_KEY
    temperature: 0.7
    max_tokens: 4096           # 思维链也算在 completion 里：写长代码建议调到 8192
    # DeepSeek 官方文档（api-docs.deepseek.com/zh-cn/quick_start/pricing）：上下文 1M
    context_window: 1000000
  qwen3-vl-plus:
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    model: qwen3-vl-plus
    api_key_env: DASHSCOPE_API_KEY
    temperature: 0.3
    max_tokens: 4096
    context_window: 32768
    supports_vision: true
  ollama:
    base_url: http://localhost:11434/v1
    model: qwen2.5:7b
    api_key_env: OLLAMA_API_KEY      # 本地可填任意非空值
    temperature: 0.7
    max_tokens: 2048
    context_window: 32768

agent:
  system_prompt_file: prompts/system.md   # 若不存在则用下面的 system_prompt
  system_prompt: "你是一个严谨、简洁的助手。"
  workspace: ./workspace        # 文件类工具的根目录，必须做 realpath 越界校验
  # 附加工作区（多根）：模型用 @名字/路径 访问，例如 read_file("@libs/http/client.py")。
  # 相对路径永远只相对主工作区解析；附加目录必须带 @名字 前缀，默认只读。
  # extra_workspaces:
  #   - name: libs
  #     path: ../SharedLibs
  #     writable: false
  extra_workspaces: []
  max_tool_rounds: 15           # 工具调用循环上限（复杂页面/长任务留足重试空间）
  max_history_messages: 40      # 未启用摘要时的兜底裁剪上限（启用摘要后不再按条数砍历史）
  context_summary_trigger: 0.8  # 上下文占用 ≥80% 时触发历史摘要压缩
  context_summary_messages: 10  # 每次摘要压缩最旧的 10 条消息
  request_timeout: 60
  max_retries: 3

tools:
  # 可选项：read_file, write_file, create_dir, delete_path, move_path, list_dir,
  #         get_time, run_shell, run_python_code, http_get
  # run_shell / http_get / run_python_code 默认不启用，需按需开启：
  #   run_shell → 先配白名单
  #   http_get  → 先配域名白名单
  #   run_python_code → 任意代码执行，确认下面的风险提示后加入 enabled
  # get_time 是示例工具（README「如何新增一个工具」的模板）：无副作用，不需要配置；
  # 不想要就从本列表里删掉它，代码留着也无害。
  enabled: [read_file, write_file, create_dir, delete_path, move_path, list_dir, get_time, search_code, git_status]
  # 危险工具调用前挂起，等人工确认（Web 端黄色审批卡片 / CLI 终端 y/N）。
  # 默认关闭，避免"复制配置直接跑批量写入"；需要时改成 true。
  require_approval: false
  # shell=True 会绕过白名单；开启时必须同时 require_approval: true
  allow_unsafe_shell: false
  # 审批只覆盖「代码执行 / 删除 / shell」；write_file、create_dir 在 workspace
  # 沙箱边界内静默执行（覆盖已有文件会在工具结果里注明），避免生成页面时逐文件打断。
  approval_required: [run_python_code, delete_path, run_shell]
  approval_timeout: 300          # 秒；超时/页面关闭都按「拒绝」处理
  run_shell:
    # 只能填 PATH 中真实存在的可执行文件（如 git、python、rg）。
    # 注意：dir / type / copy 是 cmd 内建命令，ls / cat 在 Windows 上不存在，
    # 我们用 shell=False 直接执行，这些名字一律 FileNotFoundError，不要填。
    # 空白名单 = 什么都跑不了（默认）。
    allowed_commands: []
  python_exec:
    # run_python_code：在 workspace 内执行任意 Python 代码（动态代码，非 OS 级隔离）。
    # 风险：代码以当前后端/CLI 进程的权限运行，能读写该权限触达的文件、访问网络；
    # 临时脚本写在主工作区 .agent_tmp/ 下、执行完即删，但代码本身的副作用不受限。
    # 默认关闭。确认风险后，把 run_python_code 加入上面的 enabled 才可调用；
    # 建议同时把 require_approval 设为 true（approval_required 已含该工具）。
    timeout: 10                  # 单次执行上限（秒），超时子进程被终止
    max_output_chars: 8000       # stdout / stderr 各自最大字符数，超出截断并注明省略量
  http_get:
    # 空白名单 = 不允许访问任何域名（默认）。命中规则：完全相同或其子域。
    allowed_domains: []

storage:
  db_path: ./data/sessions.db

logging:
  level: INFO
  file: ./data/agent.log