<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus 智枢</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0b1220;
        --panel: #111c33;
        --text: #e2e8f0;
        --muted: #8ca3c7;
        --accent: #38bdf8;
        --accent-2: #22d3ee;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: var(--text);
      }
      body {
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at 20% 0%, rgba(56, 189, 248, 0.16), transparent 45%),
          radial-gradient(circle at 85% 100%, rgba(34, 211, 238, 0.10), transparent 40%),
          var(--bg);
      }
      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: 100%;
        padding: 28px;
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: linear-gradient(145deg, var(--accent), var(--accent-2));
        color: #062033;
        font-size: 34px;
        font-weight: 800;
        letter-spacing: -2px;
        box-shadow: 0 12px 40px rgba(56, 189, 248, 0.28);
      }
      .logo img {
        width: 72%;
        height: 72%;
        object-fit: contain;
        display: block;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        letter-spacing: 2px;
        font-weight: 650;
      }
      .slogan {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.5px;
      }
      .status {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 18px;
        color: var(--muted);
        font-size: 12px;
      }
      .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid rgba(140, 163, 199, 0.25);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      .status.error { color: #fda4af; }
      .status.error .spinner { display: none; }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <main class="card" data-tauri-drag-region>
      <div class="logo"><img src="/logo.png" alt="Nexus 智枢 Logo" /></div>
      <h1>Nexus 智枢</h1>
      <p class="slogan">私有化 AI 调度中枢</p>
      <div class="status" id="status">
        <span class="spinner"></span>
        <span id="status-text">正在启动本地智能体……</span>
      </div>
    </main>
    <script>
      window.setSplashError = function (message) {
        var status = document.getElementById('status')
        var text = document.getElementById('status-text')
        if (status) status.classList.add('error')
        if (text) text.textContent = message || '启动失败，请查看日志'
      }
    </script>
  </body>
</html>
