# 集成测试专用配置：后端指向 tools/fake_upstream.py（8128），不碰真实 API。
# 用法：
#   python tools/fake_upstream.py 8128
#   set AGENT_CONFIG=tools/config.integration.yaml && set FAKE_API_KEY=any
#   .venv\Scripts\python.exe -m uvicorn backend.main:app --port 8000
#   cd frontend && npm run test
# 相对路径都相对本文件所在目录（tools/）。

default_model: fake

models:
  fake:
    base_url: http://127.0.0.1:8128/v1
    model: fake-model
    api_key_env: FAKE_API_KEY
    temperature: 0.0
    max_tokens: 256
    context_window: 8192

agent:
  system_prompt: "你是配置里的默认提示词。"
  workspace: ./workspace
  max_tool_rounds: 4
  max_history_messages: 40
  request_timeout: 30
  max_retries: 2
  stream: false

tools:
  enabled: [read_file, write_file, list_dir, get_time]

storage:
  db_path: ./data/integration.db

logging:
  level: WARNING
  file: ./data/integration.log